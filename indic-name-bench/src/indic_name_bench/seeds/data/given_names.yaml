# Given-name inventory, grouped origin -> gender -> ordinal frequency tier.
#
# These are name COMPONENTS: generic linguistic tokens drawn from published
# reference works on South Asian naming conventions and from general knowledge
# of the languages. This file is not a list of people, is not derived from any
# register of individuals, and no entry here refers to a specific person.
# Synthetic identities are assembled by sampling from it (see seeds/assemble.py).
#
# Tiers are ordinal judgements, not measured counts. See origins.yaml.

