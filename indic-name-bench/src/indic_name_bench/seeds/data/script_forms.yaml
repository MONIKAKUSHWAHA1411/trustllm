# Curated cross-script forms.
#
# Deliberately NOT rule-generated. A Latin -> Devanagari transliterator run in
# reverse produces forms that no native writer would produce, and evaluating
# matchers against those would measure the transliterator's errors rather than
# any real cross-script gap. Every pair below is a hand-checked conventional
# spelling.
#
# Coverage is therefore partial by construction: roughly the highest-frequency
# tokens per script. Cross-script results are reported over this subset only,
# with the covered fraction stated alongside. Contributions extending coverage
# are the single most useful thing an outside reader can add.

version: "0.1.0"

