# Bengali surnames whose anglicised and Sanskritic forms are BOTH in active
# official use for the same individuals. Structured as explicit pairs because
# the divergence is lexical, not rule-derivable: no character-level rule turns
# Chattopadhyay into Chatterjee. The bengali_anglicisation transformation reads
# this table directly. Documented in METHODOLOGY.md.
bengali_anglicisation_pairs:
  - [Chatterjee, Chattopadhyay]
  - [Banerjee, Bandopadhyay]
  - [Mukherjee, Mukhopadhyay]
  - [Ganguly, Gangopadhyay]
  - [Bhattacharya, Bhattacharjee]
  - [Chakraborty, Chakravarti]
  - [Majumdar, Mazumder]
  - [Sengupta, Sen Gupta]
  - [Dasgupta, Das Gupta]
  - [Chowdhury, Choudhuri]
  - [Talukdar, Talukder]
  - [Bardhan, Burdhan]
