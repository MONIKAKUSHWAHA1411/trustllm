# Surname inventory, grouped origin -> ordinal frequency tier.
#
# Same status as given_names.yaml: linguistic tokens, not people.
#
# Several surnames are intentionally listed under more than one origin
# (Sharma, Joshi, Patil, Rao, Das, Nayak, Varma, Kulkarni, Prasad, Singh).
# That multi-membership is real and is exactly why origin attribution from a
# name alone is unreliable. The loader keeps every membership and the sampler
# picks one at assembly time; the fairness analysis reports how much of the
# corpus is origin-ambiguous so the disparity numbers can be discounted
# accordingly.

