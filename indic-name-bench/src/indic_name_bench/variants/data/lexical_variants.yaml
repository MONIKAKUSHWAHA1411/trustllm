# The Syed cluster is separate because the token functions as an honorific,
# a given name and a surname depending on the record -- so it needs both a
# spelling class and a role-ambiguity treatment.
syed_cluster: [Syed, Sayed, Sayyid, Said, Saiyed, Seyed, Sayyed, Syeed]

# Abdul is a bound prefix meaning "servant of"; it is never a standalone name,
# and the following element is not a separate name either. Records split, fuse,
# hyphenate and assimilate it inconsistently, producing forms whose string
# distance is enormous for what is one identity.
abdul_prefix:
  prefix_forms: [Abdul, Abdel, Abd al, Abdal, Abd, Abdur, Abdour]
  # Assimilated fusions, where the /l/ of "al-" assimilates to the following
  # consonant. These are the forms that break naive matchers hardest.
  seconds:
    Rahman:  [Abdurrahman, Abdur Rahman, Abdul Rahman, Abdul-Rahman, Abdulrahman, Abd al-Rahman]
    Rahim:   [Abdurrahim, Abdur Rahim, Abdul Rahim, Abdul-Rahim, Abdulrahim]
    Karim:   [Abdul Karim, Abdulkarim, Abdul-Karim, Abdelkarim]
    Aziz:    [Abdul Aziz, Abdulaziz, Abdul-Aziz, Abdelaziz]
    Latif:   [Abdul Latif, Abdullatif, Abdul-Latif]
    Majid:   [Abdul Majid, Abdulmajid, Abdul-Majid, Abdulmajeed]
    Hamid:   [Abdul Hamid, Abdulhamid, Abdul-Hamid, Abdelhamid]
    Salam:   [Abdul Salam, Abdussalam, Abdus Salam, Abdul-Salam]
    Ghani:   [Abdul Ghani, Abdulghani, Abdul-Ghani]
    Qadir:   [Abdul Qadir, Abdulqadir, Abdul-Qadir, Abdelkader]
    Wahab:   [Abdul Wahab, Abdulwahab, Abdul-Wahab]
    Sattar:  [Abdul Sattar, Abdussattar, Abdus Sattar]
    Razzak:  [Abdul Razzak, Abdurrazzak, Abdur Razzak, Abdul-Razzaq]

# Abbreviations of Mohammed used as a name-initial honorific. Extremely common
# in South Asian records and routinely mis-parsed as a given name.
mohammed_abbreviations: [Md, Mohd, Mohd., Md., "M."]

# Non-Arabic classes where the same enumerate-don't-derive argument applies.
