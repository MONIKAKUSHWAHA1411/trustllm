  - [Salim, Saleem, Selim, Salem]
  - [Tariq, Tarique, Tareq, Tarik]
  - [Wasim, Waseem, Wassim]
  - [Nadeem, Nadim, Nadeim]
  - [Shakeel, Shakil, Shaqeel]
  - [Iqbal, Ikbal, Eqbal]
  - [Haroon, Harun, Haroun, Haroone]
  - [Bilal, Belal, Bilaal]
  - [Faisal, Faizal, Faysal, Fysal]
