# Lexical equivalence classes: spellings of one name that no character-level
# rule derives from one another.
#
# Mohammed -> Mahomed is not a sequence of edits, it is a different
# transliteration tradition. Trying to generate these with regex rewrites
# produces both false variants (strings nobody writes) and misses the real
# ones. So they are enumerated.
#
# Every member of a class is a form actually used in South Asian records. The
# first entry is the corpus's canonical form; order otherwise carries no
# meaning and the generator does not privilege position.
#
# PROVENANCE: compiled from published transliteration guidance and standard
# reference works on Arabic and Persian name romanisation, cross-checked
# against the spelling variants that appear in the public sanctions lists'
# own alias fields (OFAC SDN and the UN Consolidated List both record
# multiple romanisations per listed name). No private source was consulted.

version: "0.1.0"

arabic_persian:
  # --- The Mohammed cluster. Highest-variance name in the corpus, and the
  # single most common given name in the world, which is what makes it the
  # worst case for screening: enormous variant density multiplied by enormous
  # base frequency.
  - [Mohammed, Muhammad, Mohammad, Mohamed, Muhammed, Mahomed, Mohamad, Muhammod]
  - [Ahmed, Ahmad, Ahamed, Ahammed, Ahmet]
  - [Ali, Aly, Alee]
  - [Hussain, Hussein, Husain, Hosain, Husayn, Hussayn, Hossain]
  - [Hassan, Hasan, Hassaan, Hasaan]
  - [Ibrahim, Ebrahim, Ibraheem, Ibrahem]
  - [Yusuf, Yousuf, Yousaf, Yusof, Yousef, Yusuff]
  - [Ismail, Ismael, Esmail, Ismaeel]
